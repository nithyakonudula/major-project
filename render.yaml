services:
  - type: web
    name: unfazed-major-project-api
    runtime: node
    plan: free
    region: singapore
    rootDir: unfazed-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: static
          name: unfazed-major-project-web
          property: host

  - type: web
    name: unfazed-major-project-web
    runtime: static
    rootDir: unfazed-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: unfazed-major-project-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
